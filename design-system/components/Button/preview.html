<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Button — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }

</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  function Row(props) { return h('div', { className: 'pv-row' }, props.children); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' },
      h(Row, null,
        h(A.Button, { variant: 'primary' }, '승인'),
        h(A.Button, null, '임시저장'),
        h(A.Button, { variant: 'ghost' }, '취소'),
        h(A.Button, { variant: 'danger' }, '반려'),
        h(A.Button, { disabled: true }, '송금 완료 처리')
      ),
      h(Row, null,
        h(A.Button, { size: 'sm' }, '엑셀 다운로드'),
        h(A.Button, { size: 'sm', variant: 'ghost' }, '필터 초기화'),
        h(A.Button, { size: 'lg', variant: 'primary' }, '비용 제출')
      )
    )
  );
</script>
</body>
</html>
