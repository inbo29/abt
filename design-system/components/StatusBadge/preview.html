<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>StatusBadge — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }
  .pv-axis { width: 64px; font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  var axes = [['event', '행사'], ['cost', '비용 승인'], ['remit', '송금'], ['payment', '입금'], ['settle', '정산'], ['assign', '배정'], ['claim', '클레임'], ['risk', '검토 후보']];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv', style: { gap: '8px' } },
      axes.map(function (ax) {
        var keys = Object.keys(A.STATUS[ax[0]]);
        return h('div', { key: ax[0], className: 'pv-row', style: { gap: '6px' } },
          h('span', { className: 'pv-axis' }, ax[1]),
          keys.map(function (k) { return h(A.StatusBadge, { key: k, axis: ax[0], status: k }); })
        );
      })
    )
  );
</script>
</body>
</html>
