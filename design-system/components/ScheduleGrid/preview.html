<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ScheduleGrid — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }

</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  var dow = ['목','금','토','일','월','화','수','목','금','토','일','월','화','수'];
  var days = dow.map(function (d, i) { return { label: String(i + 1), dow: d, weekend: d === '토' || d === '일', today: i === 2 }; });
  var rows = [
    { id: 'g1', name: '바트-에르덴', meta: '한국어 · 고비 전문', items: [ { start: 2, span: 6, label: 'MN2610-014 고비 5박', state: 'confirmed' } ] },
    { id: 'g2', name: '오윤치메그', meta: '한국어 · 골프', items: [ { start: 4, span: 4, label: 'MN2610-017 테를지 골프', state: 'changed' }, { start: 9, span: 2, label: '휴무', state: 'off' } ] },
    { id: 'g3', name: '간바타르', meta: '한국어·영어', items: [ { start: 0, span: 3, label: 'MN2609-040 UB 시티', state: 'confirmed' }, { start: 2, span: 4, label: 'MN2610-019 홉스골', state: 'confirmed' } ] },
    { id: 'g4', name: '사롤', meta: '한국어 · 신입', items: [ { start: 11, span: 4, label: 'MN2610-022 UB 시티', state: 'tentative' } ] }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' }, h(A.ScheduleGrid, { days: days, rows: rows, cellWidth: 52, caption: '10월 가이드 배정' }))
  );
</script>
</body>
</html>
