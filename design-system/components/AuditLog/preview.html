<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AuditLog — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

</style>

<body class="abt-root">
<div id="root"></div>

    h('div', { className: 'pv', style: { maxWidth: '720px' } },

        { at: '2026-10-05T10:42', zone: 'KST', actor: '박서연', role: '회계', action: '지상비 금액 수정', field: '식사 (10.05)', before: '420,000 MNT', after: '510,000 MNT', reason: '현장 인원 2명 추가', approver: '김지훈' },

        { at: '2026-10-01T09:05', zone: 'KST', actor: '이도윤', role: '대표', action: '9월 정산 재개방', reason: '다온여행사 과입금 상계 누락' }

</script>

</html>
