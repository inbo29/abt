<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Select — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }

</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' },
      h('div', { className: 'pv-row' },
        h(A.Select, { inline: true, size: 'sm', label: '기간', options: ['2026년 10월', '2026년 9월', '직접 선택'] }),
        h(A.Select, { inline: true, size: 'sm', label: '여행사', options: ['전체', '푸른하늘여행', '한빛투어', '다온여행사'] }),
        h(A.Select, { inline: true, size: 'sm', label: '상태', options: ['전체', '예약', '확정', '진행 중', '완료'] })
      ),
      h('div', { style: { width: '260px' } }, h(A.Select, { label: '비용 항목', options: ['숙박', '차량·유류', '식사', '관광지 입장', '가이드비'], help: '계약 단가가 있는 항목은 단가 차이를 함께 확인합니다.' }))
    )
  );
</script>
</body>
</html>
