<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Icon — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }

</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  var names = ['layout-dashboard','bell','file-spreadsheet','calendar-days','calendar-range','clipboard-check','message-square-warning','wallet','receipt','send','arrow-left-right','scale','building-2','package','hotel','users','book-open','user-cog','history','house','plus'];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' },
      h('div', { className: 'pv-row', style: { gap: '14px', color: 'var(--ink)' } }, names.map(function (n) { return h(A.Icon, { key: n, name: n, size: 20, title: n }); })),
      h('p', { className: 'pv-note' }, '메뉴(SideNav, MobileTabBar) 전용. 버튼·배지·알림·표에는 쓰지 않는다.')
    )
  );
</script>
</body>
</html>
