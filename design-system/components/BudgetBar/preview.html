<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>BudgetBar — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }

</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv', style: { maxWidth: '520px', gap: '18px' } },
      h(A.BudgetBar, { label: '숙박', budget: 6400000, actual: 5980000, currency: 'MNT' }),
      h(A.BudgetBar, { label: '차량·유류', budget: 3200000, actual: 3420000, currency: 'MNT' }),
      h(A.BudgetBar, { label: '식사', budget: 2100000, actual: 2610000, currency: 'MNT' }),
      h('div', { className: 'pv-row', style: { width: '200px' } }, h('div', { style: { flex: 1 } }, h(A.BudgetBar, { size: 'sm', budget: 4300000, actual: 4820000 })))
    )
  );
</script>
</body>
</html>
