<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ABT Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .ink { fill: var(--ink); }
  .att { fill: var(--attention); }
  .crit { fill: var(--critical); }
  .dash { fill: none; stroke: var(--line-strong); stroke-width: 1.5px; stroke-dasharray: 6 4; }
  .blk { rx: var(--radius-md); }
  .bar { rx: var(--radius-sm); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 100px; line-height: .92; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink slab 200×224 bled off the top (확정 = solid, the largest) · attention 120×48 and critical 72×48 side by side under it (the two risk signals) · ink bars in the pattern add ~12% more ink
  arrangement one tall ink slab at the left of the box with a short risk strip beneath; the pattern fills the right side and bleeds off the right edge
  pattern     a schedule of bars, from "점선은 예상, 실선은 확정": 20px bars on a space-8 (32px) row pitch, dashed line-strong outlines (가배정·예상) beside solid ink bars (확정)
  scales      sides in space-2 multiples; gutters space-2/space-4; row pitch space-8; slab and risk blocks radius-md, bars radius-sm
-->
<rect class="ink blk" x="16" y="-8" width="200" height="224" rx="6"/>
<rect class="att blk" x="16" y="232" width="120" height="48" rx="6"/>
<rect class="crit blk" x="144" y="232" width="72" height="48" rx="6"/>
<rect class="dash bar" x="232.75" y="8.75" width="110.5" height="18.5" rx="4"/>
<rect class="ink bar" x="352" y="8" width="136" height="20" rx="4"/>
<rect class="ink bar" x="232" y="40" width="64" height="20" rx="4"/>
<rect class="dash bar" x="304.75" y="40.75" width="94.5" height="18.5" rx="4"/>
<rect class="ink bar" x="408" y="40" width="80" height="20" rx="4"/>
<rect class="ink bar" x="232" y="72" width="160" height="20" rx="4"/>
<rect class="dash bar" x="400.75" y="72.75" width="94.5" height="18.5" rx="4"/>
<rect class="dash bar" x="264.75" y="104.75" width="70.5" height="18.5" rx="4"/>
<rect class="ink bar" x="344" y="104" width="144" height="20" rx="4"/>
<rect class="ink bar" x="232" y="136" width="96" height="20" rx="4"/>
<rect class="dash bar" x="336.75" y="136.75" width="62.5" height="18.5" rx="4"/>
<rect class="dash bar" x="408.75" y="136.75" width="70.5" height="18.5" rx="4"/>
<rect class="dash bar" x="232.75" y="168.75" width="46.5" height="18.5" rx="4"/>
<rect class="ink bar" x="288" y="168" width="120" height="20" rx="4"/>
<rect class="dash bar" x="416.75" y="168.75" width="78.5" height="18.5" rx="4"/>
<rect class="dash bar" x="232.75" y="200.75" width="182.5" height="18.5" rx="4"/>
<rect class="ink bar" x="232" y="232" width="56" height="20" rx="4"/>
<rect class="dash bar" x="296.75" y="232.75" width="134.5" height="18.5" rx="4"/>
<rect class="dash bar" x="232.75" y="264.75" width="94.5" height="18.5" rx="4"/>
<rect class="ink bar" x="336" y="264" width="152" height="20" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">ABT Ops</h1>
<p class="tag">색은 상태에만, 점선은 예상에만.</p>
</div>
</div>
</body>
</html>
