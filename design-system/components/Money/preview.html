<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Money — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .pv { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pv-note { margin: 0; font: 400 12px/18px var(--font-sans); color: var(--ink-muted); }
  .pv-grid { display: grid; grid-template-columns: 96px 220px; gap: 8px 16px; align-items: baseline; } .pv-k { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body class="abt-root">
<div id="root"></div>
<script>
  var A = window.Abt, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'pv' },
      h('div', { className: 'pv-grid' },
        h('span', { className: 'pv-k' }, '확정 지상비'), h(A.Money, { amount: 18450000, currency: 'MNT' }),
        h('span', { className: 'pv-k' }, '예상 지상비'), h(A.Money, { amount: 17200000, currency: 'MNT', kind: 'expected', tag: true }),
        h('span', { className: 'pv-k' }, '현지 송금'), h(A.Money, { amount: 12500000, currency: 'MNT', converted: { amount: 4981250, currency: 'KRW' }, rate: { value: 0.3985, date: '10.01' } }),
        h('span', { className: 'pv-k' }, '행사 손익'), h(A.Money, { amount: -1240000, currency: 'KRW', lossTone: true }),
        h('span', { className: 'pv-k' }, '옵션 판매'), h(A.Money, { amount: 1280.5, currency: 'USD' })
      )
    )
  );
</script>
</body>
</html>
