<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>과입·차감</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/abt/tokens.css">
<link rel="stylesheet" href="ds/abt/components/bundle.css">
<script src="ds/abt/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" class="abt-root" style="display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font-sans)">
<div style="position: sticky; top: 0; align-self: start; height: 100vh">
<x-import component-from-global-scope="Abt.SideNav" active="balance" org="ABT 한국·몽골 통합" links="{{links}}" counts="{{navCounts}}" user="{{user}}" logout="Login.dc.html" theme="{{theme}}" on-theme-change="{{setTheme}}" style="display: block; height: 100%"></x-import>
</div>
<main style="min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 28px 32px 48px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="title-1" style="margin: 0">과입·차감</h1>
<p class="caption" style="margin: 0; color: var(--ink-muted)">거래처·행사·통화별 잔액 원장 · 발생 → 사용·상계·환불 순서로 기록하고 잔액이 0이 되면 닫습니다 · 부호: + 우리가 돌려줄 돈, − 받을 돈</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<x-import component-from-global-scope="Abt.Segmented" options="{{filterOptions}}" value="{{filter}}" on-change="{{setFilter}}" aria-label="잔액 구분"></x-import>
</div>
</header>
<sc-if value="{{hasNotice}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="Abt.Alert" tone="{{notice.tone}}" title="{{notice.title}}" action="{{noticeAction}}">{{notice.body}}</x-import>
</sc-if>
<section aria-label="잔액 지표" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<x-import component-from-global-scope="Abt.KpiTile" label="여행사에 돌려줄 돈" money="{{kpi.payable}}" caption="과입·취소 환불 · KRW"></x-import>
<x-import component-from-global-scope="Abt.KpiTile" label="업체에서 받을 돈" money="{{kpi.receivable}}" caption="보상·단가 차감 · MNT"></x-import>
<x-import component-from-global-scope="Abt.KpiTile" label="상계 대기" value="{{kpi.offset}}" unit="건" caption="다음 청구·지급에서 정리"></x-import>
<x-import component-from-global-scope="Abt.KpiTile" label="환불 대기" value="{{kpi.refund}}" unit="건" caption="계좌·증빙 확인 후 처리"></x-import>
</section>
<div style="display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); gap: 16px; align-items: start">
<x-import component-from-global-scope="Abt.DataTable" columns="{{cols}}" rows="{{rows}}" on-row-click="{{pick}}" caption="잔액 원장" empty="해당하는 잔액이 없습니다."></x-import>
<section style="position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0"><div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
<span style="font: 500 13px/20px var(--font-mono)">{{cur.id}}</span>
<x-import component-from-global-scope="Abt.StatusBadge" tone="{{cur.tone}}" form="{{cur.form}}" size="md">{{cur.stLabel}}</x-import>
</div>
<h2 class="title-2" style="margin: 0">{{cur.party}} · {{cur.title}}</h2>
<x-import component-from-global-scope="Abt.Money" amount="{{cur.balance}}" currency="{{cur.cur}}" size="lg" align="start" sign="always"></x-import>
</div>
<dl style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 13px; line-height: 20px">
<dt class="label" style="color: var(--ink-muted); line-height: 20px">관련 행사</dt>
<dd style="margin: 0; min-width: 0">{{cur.event}}</dd>
<dt class="label" style="color: var(--ink-muted); line-height: 20px">발생 사유</dt>
<dd style="margin: 0; min-width: 0">{{cur.reason}}</dd>
<dt class="label" style="color: var(--ink-muted); line-height: 20px">근거</dt>
<dd style="margin: 0; min-width: 0">{{cur.proof}}</dd>
</dl>
<div style="display: flex; flex-direction: column">
<span class="label" style="color: var(--ink-muted); padding-bottom: 4px">원장</span>
<sc-for list="{{cur.lines}}" as="l" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 20px"><span style="display: flex; flex-direction: column; gap: 2px"><span>{{l.label}}</span><span class="caption" style="color: var(--ink-muted)">{{l.sub}}</span></span><x-import component-from-global-scope="Abt.Money" amount="{{l.amount}}" currency="{{cur.cur}}" size="sm" sign="always"></x-import></div>
</sc-for>
</div>
<sc-if value="{{cur.isOpen}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line)">
<x-import component-from-global-scope="Abt.Select" label="처리 방법" options="{{cur.methods}}" value="{{method}}" on-change="{{setMethod}}" help="{{methodHelp}}"></x-import>
<x-import component-from-global-scope="Abt.TextField" label="처리 근거" placeholder="예: 다온여행사 담당 확인 메일(10.01)" value="{{why}}" on-change="{{setWhy}}" error="{{whyError}}"></x-import>
<div style="display: flex; justify-content: flex-end"><x-import component-from-global-scope="Abt.Button" variant="primary" on-click="{{settle}}">{{settleLabel}}</x-import></div>
</div>
</sc-if>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"화면"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.abtStore = {
      get: (k, d) => { try { const v = window.localStorage.getItem('abt:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      put: (k, v) => { try { window.localStorage.setItem('abt:' + k, JSON.stringify(v)); } catch (e) {} }
    };
    let saved;
    try { saved = window.localStorage.getItem('abt-theme') || undefined; } catch (e) { saved = undefined; }
    this.state = Object.assign({ theme: saved }, { filter: '잔액 있음', selected: 'BL-1001', method: null, why: '', whyError: '', notice: null,
      ledger: [
        { id: 'BL-1001', party: '다온여행사', title: '취소 환불 대기', code: 'MN2610-024', event: 'MN2610-024 울란바토르 시티 · 09.29 취소', cur: 'KRW', plan: '환불', reason: '계약금 1,980,000 − 취소 수수료 20% 1,320,000', proof: '취소 요청 메일(09.29) · 약관 제7조', methods: ['MN2609-031 미수와 상계', '환불 송금'], lines: [ { label: '발생 09.29', sub: '계약금 1,980,000 입금분 중 환불 대상', amount: 660000 } ] },
        { id: 'BL-0928', party: '한빛투어', title: '잔금 과입', code: 'MN2610-005', event: 'MN2610-005 테를지 골프', cur: 'KRW', plan: '상계', reason: '09.28 입금 14,650,000 − 청구 잔금 12,800,000', proof: '기업은행 입금 내역(09.28)', methods: ['다음 청구에서 차감(MN2610-031)', '환불 송금'], lines: [ { label: '발생 09.28', sub: '입금 배분 후 남은 금액', amount: 1850000 } ] },
        { id: 'BL-0926', party: '고비 오아시스 캠프', title: '보상 차감', code: 'MN2609-033', event: 'MN2609-033 고비 사막 · CL2609-003', cur: 'MNT', plan: '상계', reason: '캠프 온수 고장 1박 환불을 업체가 부담', proof: '캠프 확인서(09.27) · 이도윤 승인', methods: ['10월 지급에서 차감', '환불 송금'], lines: [ { label: '발생 09.27', sub: '업체 책임 확인 · 다음 지급에서 차감', amount: -2260000 } ] },
        { id: 'BL-0925', party: '고비모터스', title: '단가 차이 차감', code: 'MN2610-002', event: 'MN2610-002 고비 사막 · 푸르공 3대', cur: 'MNT', plan: '상계', reason: '청구 420,000 vs 계약 400,000 MNT/일 × 3대 × 6일', proof: '2026 동계 요금표 · 고비모터스 청구서', methods: ['단가 확인 후 차감', '10월 지급에서 차감'], lines: [ { label: '발생 10.01', sub: '단가 차이 검토 후보에서 생성', amount: -360000 } ] },
        { id: 'BL-0912', party: '한빛투어', title: '8월 과입 상계', code: 'MN2608-012', event: 'MN2608-012 테를지 골프', cur: 'KRW', plan: '상계', reason: '8월 잔금 과입', proof: '8월 재개방 승인(09.12)', methods: [], lines: [ { label: '발생 08.28', sub: '잔금 과입', amount: 1200000 }, { label: '상계 09.12', sub: '9월 계약금 청구에서 차감', amount: -1200000 } ] }
      ] });
  }
  componentDidMount() {
    this._onStorage = (e) => { if (!e || !e.key) return; if (e.key === 'abt-theme' && (e.newValue === 'dark' || e.newValue === 'light')) this.setState({ theme: e.newValue }); else if (e.key.indexOf('abt:') === 0) { const k = e.key.slice(4); const map = (this.state && this.state.__sync) || {}; const patch = { storeRev: Date.now() }; if (map[k]) { let v = null; try { v = e.newValue == null ? null : JSON.parse(e.newValue); } catch (x) { v = null; } patch[map[k][0]] = v == null ? map[k][1] : v; } this.setState(patch); } };
    try { window.addEventListener('storage', this._onStorage); } catch (e) {}
  }
  componentWillUnmount() {
    try { window.removeEventListener('storage', this._onStorage); } catch (e) {}
  }
  renderVals() {
    const LINKS = { dashboard: 'Main.dc.html', alerts: 'Alerts.dc.html', reports: 'Reports.dc.html', events: 'Events.dc.html', schedule: 'Schedule.dc.html', field: 'FieldReports.dc.html', claims: 'Claims.dc.html', receipts: 'Receipts.dc.html', costs: 'Approvals.dc.html', remit: 'Remittance.dc.html', balance: 'Balance.dc.html', settlement: 'Settlement.dc.html', agencies: 'Agencies.dc.html', products: 'Products.dc.html', partners: 'Partners.dc.html', resources: 'Resources.dc.html', manuals: 'Manuals.dc.html', users: 'Users.dc.html', audit: 'Audit.dc.html' };
    const s = this.state;
    const set = (patch) => this.setState(patch);
    const store = this.abtStore;
    const fmt = (n, d) => new Intl.NumberFormat('ko-KR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }).format(n);
    const fin = (w) => { const c = String(w).charCodeAt(String(w).length - 1); return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 : -1; };
    const ro = (w) => w + (fin(w) === 0 || fin(w) === 8 || fin(w) === -1 ? '로' : '으로');
    const eul = (w) => w + (fin(w) > 0 ? '을' : '를');
    const say = (tone, title, body, action) => this.setState({ notice: { tone, title, body: body || '', action: action || null } });

    const L = s.ledger;
    const bal = (e) => e.lines.reduce((a, l) => a + l.amount, 0);
    const filter = s.filter;
    const list = L.filter((e) => (filter === '잔액 있음' ? bal(e) !== 0 : filter === '정리됨' ? bal(e) === 0 : true));
    const cur = L.find((e) => e.id === s.selected) || L[0];
    const NOW = '10.01 16:05 KST';
    const M = cur.methods || [];
    const method = s.method && M.includes(s.method) ? s.method : M[0];
    const HELP = {
      'MN2609-031 미수와 상계': '다온여행사 MN2609-031 잔금 12,400,000 KRW에서 660,000 KRW를 뺍니다. 환불 송금은 생기지 않습니다.',
      '환불 송금': '여행사 계좌로 돌려보냅니다. 송금증을 붙여야 완료됩니다.',
      '다음 청구에서 차감(MN2610-031)': '11월 행사 계약금 청구서에 −1,850,000 KRW 줄로 들어갑니다.',
      '10월 지급에서 차감': '다음 캠프 지급 요청에서 같은 금액을 빼고 송금합니다.',
      '단가 확인 후 차감': '계약 단가가 맞으면 다음 지급에서 360,000 MNT를 뺍니다.'
    };

    return {
      theme: s.theme || this.props.theme || 'dark',
      themeOptions: [{ value: 'dark', label: '다크' }, { value: 'light', label: '라이트' }],
      setTheme: (v) => { try { window.localStorage.setItem('abt-theme', v); } catch (e) {} this.setState({ theme: v }); },
      yes: true,
      no: false,
      two: 2,
      three: 3,
      hasNotice: !!s.notice,
      notice: s.notice || { tone: 'positive', title: '', body: '' },
      noticeAction: s.notice && s.notice.action ? s.notice.action : { label: '닫기', onClick: () => this.setState({ notice: null }) },
      links: LINKS,
      navCounts: { alerts: 5, field: 2, claims: { n: 2, tone: 'critical' }, receipts: { n: 1, tone: 'critical' }, costs: { n: 7, tone: 'attention' }, remit: 3 },
      user: { name: '박서연', role: '회계담당자' },
      filterOptions: ['잔액 있음', '정리됨', '전체'],
      filter,
      setFilter: (v) => set({ filter: v }),
      kpi: {
        payable: { amount: L.filter((e) => e.cur === 'KRW' && bal(e) > 0).reduce((a, e) => a + bal(e), 0), currency: 'KRW', compact: false },
        receivable: { amount: -L.filter((e) => e.cur === 'MNT' && bal(e) < 0).reduce((a, e) => a + bal(e), 0), currency: 'MNT', compact: false },
        offset: L.filter((e) => bal(e) !== 0 && e.plan === '상계').length,
        refund: L.filter((e) => bal(e) !== 0 && e.plan === '환불').length
      },
      cols: [
        { key: 'id', label: '번호', type: 'muted' },
        { key: 'party', label: '거래처 / 사유', type: 'stack' },
        { key: 'event', label: '행사', type: 'code' },
        { key: 'balance', label: '잔액', type: 'money' },
        { key: 'st', label: '상태', type: 'status' }
      ],
      rows: list.map((e) => { const b = bal(e); return { id: e.id, href: 'EventDetail.dc.html', party: { primary: e.party, secondary: e.title }, event: e.code, balance: { amount: b, currency: e.cur, sign: 'always' }, st: b === 0 ? { tone: 'neutral', status: '정리됨' } : { tone: e.plan === '환불' ? 'attention' : 'progress', form: 'dashed', status: `${e.plan} 대기` }, selected: e.id === cur.id, dim: b === 0 }; }),
      pick: (row) => set({ selected: row.id, method: null, why: '', whyError: '' }),
      cur: { ...cur, balance: bal(cur), isOpen: bal(cur) !== 0, stLabel: bal(cur) === 0 ? '정리됨' : `${cur.plan} 대기`, tone: bal(cur) === 0 ? 'neutral' : cur.plan === '환불' ? 'attention' : 'progress', form: bal(cur) === 0 ? 'solid' : 'dashed' },
      method,
      setMethod: (e) => set({ method: e.target.value }),
      methodHelp: HELP[method] || '',
      why: s.why,
      setWhy: (e) => set({ why: e.target.value, whyError: '' }),
      whyError: s.whyError || '',
      settleLabel: method && method.includes('환불') ? '환불 요청' : '상계 처리',
      settle: () => {
        if (!s.why.trim()) { set({ whyError: '처리 근거를 남겨야 합니다. 감사 로그에 같이 저장됩니다.' }); return; }
        const b = bal(cur);
        const line = { label: `${method.includes('환불') ? '환불' : '상계'} ${NOW.slice(0, 5)}`, sub: `${method} · ${s.why.trim()}`, amount: -b };
        this.setState({ ledger: L.map((e) => (e.id === cur.id ? { ...e, lines: e.lines.concat([line]) } : e)), why: '', method: null, notice: { tone: 'positive', title: `${cur.id} 잔액을 0으로 정리했습니다`, body: method === 'MN2609-031 미수와 상계' ? '다온여행사 MN2609-031 미수가 12,400,000 → 11,740,000 KRW로 줄었습니다.' : method.includes('환불') ? '회계 송금 대기열에 환불 1건이 올라갔습니다. 송금증을 붙이면 완료됩니다.' : '다음 청구·지급 때 차감되도록 연결했습니다.', action: method === 'MN2609-031 미수와 상계' ? { label: '입금 원장', href: 'Receipts.dc.html' } : null } });
      },
    };
  }
}
</script>
</body>
</html>
